name: Build SMS Dashboard APK

on:
  push:
    branches: [ android-source ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SMSDashboard.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMSDashboard-APK
          path: app/build/outputs/apk/debug/SMSDashboard.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SMS Dashboard APK - Build #${{ github.run_number }}"
          body: |
            ## SMS Dashboard APK Ready!

            ### Install Steps:
            1. Neeche SMSDashboard.apk download karo
            2. Phone mein install karo
            3. Agar blocked ho → Settings → Install unknown apps → Allow
            4. App kholo → API Key daalo → Save
            5. Done! SMS automatically forward hoga
          files: app/build/outputs/apk/debug/SMSDashboard.apk
          token: ${{ secrets.GITHUB_TOKEN }}
