name: Build SMS Dashboard Viewer APK

on:
  push:
    branches: [ android-dashboard ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SMSDashboard-Viewer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: viewer-v1.0.${{ github.run_number }}
          name: "SMS Dashboard Viewer APK #${{ github.run_number }}"
          body: |
            ## SMS Dashboard Viewer App

            Yeh app dashboard dekhne ke liye hai.
            SMS forward karne ke liye alag SMS Forwarder app use karo.

            ### Install:
            1. app-debug.apk download karo
            2. Install karo
            3. sms.bharatseo.site seedha app mein khuliga
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
