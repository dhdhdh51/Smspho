name: Build SMS Dashboard APK

on:
  push:
    branches: [ android-source ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSDashboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SMS Dashboard v1.0.${{ github.run_number }}
          body: |
            ## SMS Dashboard APK

            Automatic build from source code.

            ### Install karne ke steps:
            1. `SMSDashboard.apk` download karo
            2. Phone mein install karo (Unknown sources allow karo)
            3. App kholo → API Key paste karo → Save
            4. Done! SMS automatically forward hoga

            **Webhook:** https://sms.bharatseo.site/api/receive.php
          files: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
