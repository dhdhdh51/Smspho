plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.smsdashboard'

    defaultConfig {
        applicationId "com.smsdashboard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {}
