<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Offline – Private SMS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(ellipse at top, #1e3a5f 0%, #0f172a 60%); min-height: 100vh; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .wifi { animation: pulse 2s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .float { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6 text-white">
  <div class="text-center max-w-sm">
    <div class="float mb-8">
      <div class="inline-flex items-center justify-center w-28 h-28 rounded-3xl bg-gradient-to-br from-blue-500/20 to-indigo-600/20 border border-blue-500/30 mb-2">
        <svg class="w-14 h-14 text-blue-400 wifi" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-bold mb-2">You're offline</h1>
    <p class="text-gray-400 text-sm mb-8 leading-relaxed">
      No internet connection detected. SMS messages cached locally are still accessible.
      Reconnect to see new messages.
    </p>

    <div class="space-y-3">
      <button onclick="location.reload()"
        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-3.5 rounded-2xl transition-all hover:opacity-90 active:scale-95">
        Try Again
      </button>
      <a href="/dashboard.php"
        class="block w-full bg-white/5 border border-white/10 text-white font-medium py-3.5 rounded-2xl text-sm">
        Go to Dashboard
      </a>
    </div>

    <p class="text-xs text-gray-700 mt-8">Private SMS Dashboard • Cached version</p>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => location.reload());

    // Check connectivity every 10 seconds
    setInterval(() => {
      if (navigator.onLine) location.reload();
    }, 10000);
  </script>
</body>
</html>
